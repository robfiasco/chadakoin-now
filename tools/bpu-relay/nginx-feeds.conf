    # BPU feed relay — static files written by /usr/local/bin/bpu-relay.py
    # (cron: /etc/cron.d/bpu-relay). Served by nginx directly, never Next.
    location /feeds/ {
        alias /var/www/feeds/;
        autoindex off;
        types {
            application/xml  xml;
            application/json json;
        }
        charset utf-8;
        charset_types application/xml application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

